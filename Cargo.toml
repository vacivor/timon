[package]
name = "timon"
version = "0.1.0"
edition = "2024"
description = "SSH and local terminal client"
license = "Proprietary"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
bytemuck = { version = "1.24.0", features = ["derive"], optional = true }
copypasta = "0.10.2"
iced = { version = "0.14.0", features = ["tokio", "canvas", "advanced", "image", "svg"], optional = true }
iced_wgpu = { version = "0.14.0", optional = true }
libc = "0.2"
portable-pty = "0.9.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
russh = "0.60.0"
russh-sftp = "2.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.16.1", features = ["unstable-winit-030"], optional = true }
winit = { version = "0.30", optional = true }
toml = "1.1.2"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = ["slint-ui"]
iced-ui = ["dep:bytemuck", "dep:iced", "dep:iced_wgpu"]
slint-ui = ["dep:slint", "dep:winit"]

[package.metadata.bundle]
name = "Timon"
identifier = "io.vacivor.timon"
short-description = "SSH and local terminal client"
category = "Developer Tool"

[package.metadata.packager]
product-name = "Timon"
identifier = "io.vacivor.timon"

[[bin]]
name = "Timon"
path = "src/main.rs"

[[bin]]
name = "TimonSlintTerminal"
path = "src/slint_main.rs"
required-features = ["slint-ui"]

[[bin]]
name = "TimonSlintShell"
path = "src/slint_shell.rs"
required-features = ["slint-ui"]
